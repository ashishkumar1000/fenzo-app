# Daemon JVM criteria (Gradle 8.8+): pin the JVM version Gradle runs with.
# JDK 26 breaks AGP's core-for-system-modules jlink transform, so the build
# requires JDK 17. Gradle picks up any installed JDK 17 automatically
# (regardless of JAVA_HOME); if none is installed, the foojay resolver in
# settings.gradle downloads one.
toolchainVersion=17